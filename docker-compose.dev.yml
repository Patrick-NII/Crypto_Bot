# =============================================================================
# GlueTrade — DEV environment overlay
# Usage: make dev  (or docker compose -p gluetrade-dev -f ... up -d)
#
# Launches ONLY frontend + gateway on separate ports (3100, 8100).
# Backend services (auth, portfolio, trading, etc.) are shared with staging.
# Postgres and Redis are shared too.
#
# This means staging must be running first: make staging
# Then: make dev (adds dev frontend + gateway on top)
# =============================================================================

services:
  # Dev frontend on port 3100
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gluetrade-frontend-dev
    ports:
      - "${DEV_FRONTEND_PORT:-3100}:80"
    depends_on:
      gateway-dev:
        condition: service_started
    networks:
      - gluetrade-net

  # Trading-only frontend on port 3200 for the Trading branch
  frontend-trading:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gluetrade-frontend-trading
    ports:
      - "${TRADING_FRONTEND_PORT:-3200}:80"
    depends_on:
      gateway-dev:
        condition: service_started
    networks:
      - gluetrade-net

  # Dev gateway on port 8100 — routes to the SAME backend services
  gateway-dev:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gluetrade-gateway-dev
    ports:
      - "${DEV_GATEWAY_PORT:-8100}:8000"
    environment:
      - AUTH_SERVICE_URL=http://gluetrade-auth:8001
      - PORTFOLIO_SERVICE_URL=http://gluetrade-portfolio:8002
      - MARKET_DATA_SERVICE_URL=http://gluetrade-market-data:8003
      - TRADING_ENGINE_URL=http://gluetrade-trading:8004
      - RISK_SERVICE_URL=http://gluetrade-risk:8005
      - ML_SERVICE_URL=http://gluetrade-ml:8006
      - NOTIFICATION_SERVICE_URL=http://gluetrade-notifications:8007
      - AI_AGENT_SERVICE_URL=http://gluetrade-ai-agent:8008
      - MAILING_SERVICE_URL=http://gluetrade-mailing:8009
      - NEWS_SERVICE_URL=http://gluetrade-news:8011
      - REDIS_HOST=gluetrade-redis
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
      - RATE_LIMIT_PER_MINUTE=500
    networks:
      gluetrade-net:
        aliases:
          - gluetrade-gateway

networks:
  gluetrade-net:
    external: true
    name: ${GLUETRADE_NETWORK_NAME:-crypto_bot_gluetrade-net}
