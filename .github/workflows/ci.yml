# =============================================================================
# CI — Runs on every push and pull request
# On dev branch: validates + auto-promotes to staging if CI passes
# =============================================================================

name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/okamoey

permissions:
  contents: write

jobs:
  # ── Frontend checks ──────────────────────────────────────────────
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # ── Docker build validation ──────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - gateway
          - auth-service
          - portfolio-service
          - trading-engine
          - market-data-service
          - risk-service
          - ai-agent-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ hashFiles('VERSION') != '' && '$(cat VERSION)' || '0.0.0-ci' }}
            APP_ENV=ci
            BUILD_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:ci-${{ github.sha }}

  # ── Auto-promote dev → staging ───────────────────────────────────
  promote-to-staging:
    name: Promote dev → staging
    needs: [frontend, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.0.0')" >> "$GITHUB_OUTPUT"

      - name: Merge dev into staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout staging
          git merge dev --no-edit -m "ci: promote dev → staging (v${{ steps.version.outputs.version }}, ${{ github.sha }})"
          git push origin staging

      - name: Summary
        run: |
          echo "## Promoted to staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** dev → staging" >> $GITHUB_STEP_SUMMARY
