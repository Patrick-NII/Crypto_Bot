version: "3.9"

services:
  # ─── Infrastructure ────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: okamoey-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-okamoey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okamoey_dev}
      POSTGRES_DB: ${POSTGRES_DB:-okamoey_trading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okamoey}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - okamoey-net

  redis:
    image: redis:7-alpine
    container_name: okamoey-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - okamoey-net

  # ─── API Gateway ───────────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: okamoey-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:8002
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8003
      - TRADING_ENGINE_URL=http://trading-engine:8004
      - RISK_SERVICE_URL=http://risk-service:8005
      - ML_SERVICE_URL=http://ml-service:8006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - okamoey-net

  # ─── Auth Service ──────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: okamoey-auth
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Portfolio Service ─────────────────────────────────────────
  portfolio-service:
    build:
      context: ./services/portfolio-service
      dockerfile: Dockerfile
    container_name: okamoey-portfolio
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8003
    ports:
      - "${PORTFOLIO_SERVICE_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Market Data Service ───────────────────────────────────────
  market-data-service:
    build:
      context: ./services/market-data-service
      dockerfile: Dockerfile
    container_name: okamoey-market-data
    environment:
      - REDIS_HOST=redis
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
    ports:
      - "${MARKET_DATA_SERVICE_PORT:-8003}:8003"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Trading Engine ────────────────────────────────────────────
  trading-engine:
    build:
      context: ./services/trading-engine
      dockerfile: Dockerfile
    container_name: okamoey-trading
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8003
      - RISK_SERVICE_URL=http://risk-service:8005
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:8002
      - TRADING_MODE=${TRADING_MODE:-paper}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
    ports:
      - "${TRADING_ENGINE_PORT:-8004}:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Risk Service ──────────────────────────────────────────────
  risk-service:
    build:
      context: ./services/risk-service
      dockerfile: Dockerfile
    container_name: okamoey-risk
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - MAX_PORTFOLIO_DRAWDOWN=${MAX_PORTFOLIO_DRAWDOWN:-0.15}
      - DEFAULT_STOP_LOSS_PCT=${DEFAULT_STOP_LOSS_PCT:-0.05}
    ports:
      - "${RISK_SERVICE_PORT:-8005}:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── ML Service ────────────────────────────────────────────────
  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    container_name: okamoey-ml
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8003
    ports:
      - "${ML_SERVICE_PORT:-8006}:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Notification Service ──────────────────────────────────────
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: okamoey-notifications
    environment:
      - REDIS_HOST=redis
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8007}:8007"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

volumes:
  postgres_data:
  redis_data:

networks:
  okamoey-net:
    driver: bridge
