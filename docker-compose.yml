version: "3.9"

services:
  # ─── Infrastructure ────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: okamoey-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-okamoey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okamoey_dev}
      POSTGRES_DB: ${POSTGRES_DB:-okamoey_trading}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okamoey}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - okamoey-net

  redis:
    image: redis:7-alpine
    container_name: okamoey-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - okamoey-net

  # ─── API Gateway ───────────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: okamoey-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:8002
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8003
      - TRADING_ENGINE_URL=http://trading-engine:8004
      - RISK_SERVICE_URL=http://risk-service:8005
      - ML_SERVICE_URL=http://ml-service:8006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - AI_AGENT_SERVICE_URL=http://ai-agent-service:8008
      - MAILING_SERVICE_URL=http://mailing-service:8009
      - NEWS_SERVICE_URL=http://news-service:8011
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - okamoey-net

  # ─── Auth Service ──────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: okamoey-auth
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - MAILING_SERVICE_URL=http://mailing-service:8009
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Portfolio Service ─────────────────────────────────────────
  portfolio-service:
    build:
      context: ./services/portfolio-service
      dockerfile: Dockerfile
    container_name: okamoey-portfolio
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8003
    ports:
      - "${PORTFOLIO_SERVICE_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Market Data Service ───────────────────────────────────────
  market-data-service:
    build:
      context: ./services/market-data-service
      dockerfile: Dockerfile
    container_name: okamoey-market-data
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
    ports:
      - "${MARKET_DATA_SERVICE_PORT:-8003}:8003"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Trading Engine ────────────────────────────────────────────
  trading-engine:
    build:
      context: ./services/trading-engine
      dockerfile: Dockerfile
    container_name: okamoey-trading
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8003
      - RISK_SERVICE_URL=http://risk-service:8005
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:8002
      - AUTH_SERVICE_URL=http://auth-service:8001
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - TRADING_MODE=${TRADING_MODE:-paper}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
    ports:
      - "${TRADING_ENGINE_PORT:-8004}:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Risk Service ──────────────────────────────────────────────
  risk-service:
    build:
      context: ./services/risk-service
      dockerfile: Dockerfile
    container_name: okamoey-risk
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - MAX_PORTFOLIO_DRAWDOWN=${MAX_PORTFOLIO_DRAWDOWN:-0.15}
      - DEFAULT_STOP_LOSS_PCT=${DEFAULT_STOP_LOSS_PCT:-0.05}
    ports:
      - "${RISK_SERVICE_PORT:-8005}:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── ML Service ────────────────────────────────────────────────
  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    container_name: okamoey-ml
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8003
    ports:
      - "${ML_SERVICE_PORT:-8006}:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Notification Service ──────────────────────────────────────
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: okamoey-notifications
    environment:
      - REDIS_HOST=redis
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8007}:8007"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Mailing Service ────────────────────────────────────────
  mailing-service:
    build:
      context: ./services/mailing-service
      dockerfile: Dockerfile
    container_name: okamoey-mailing
    environment:
      - REDIS_HOST=redis
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@okamoey.com}
    ports:
      - "${MAILING_SERVICE_PORT:-8009}:8009"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── AI Agent Service ───────────────────────────────────────
  ai-agent-service:
    build:
      context: ./services/ai-agent-service
      dockerfile: Dockerfile
    container_name: okamoey-ai-agent
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - MARKET_DATA_URL=http://market-data-service:8003
      - PORTFOLIO_URL=http://portfolio-service:8002
      - TRADING_URL=http://trading-engine:8004
      - RISK_URL=http://risk-service:8005
      - STRATEGY_URL=http://ml-service:8006
      - AUTH_URL=http://auth-service:8001
    ports:
      - "${AI_AGENT_SERVICE_PORT:-8008}:8008"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Billing Service ────────────────────────────────────────
  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile
    container_name: okamoey-billing
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-okamoey}:${POSTGRES_PASSWORD:-okamoey_dev}@postgres:5432/${POSTGRES_DB:-okamoey_trading}
      - REDIS_HOST=redis
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      - STRIPE_PRICE_ENTERPRISE=${STRIPE_PRICE_ENTERPRISE:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BILLING_SERVICE_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

  # ─── Binance Proxy ──────────────────────────────────────────
  binance-proxy:
    build:
      context: ./frontend
      dockerfile: binance-proxy.Dockerfile
    container_name: okamoey-binance-proxy
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY:-}
    ports:
      - "3001:3001"
    networks:
      - okamoey-net

  # ─── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        APP_ENV: ${APP_ENV:-staging}
        BUILD_SHA: ${BUILD_SHA:-local}
    container_name: okamoey-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_started
      binance-proxy:
        condition: service_started
    networks:
      - okamoey-net

  # ─── News Intelligence Service ──────────────────────────────
  news-service:
    build:
      context: ./services/news-service
      dockerfile: Dockerfile
    container_name: okamoey-news
    environment:
      - REDIS_HOST=redis
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "${NEWS_SERVICE_PORT:-8011}:8011"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - okamoey-net

volumes:
  postgres_data:
  redis_data:

networks:
  okamoey-net:
    driver: bridge
